<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>µPen Editor | v0.9.1</title>

    <style>
        :root {
            --bg-color: #1e1e1e;
            --toolbar-color: #2d2d2d;
            --text-color: #d4d4d4;
            --accent-color: #333333;
            --accent-hover: #454545;
            --border-color: #3c3c3c;
            --icon-fill: #cccccc;
            --danger-hover: #8e2e2e;
            --info-color: #777;
            --interactive-accent: #007acc;
        }

        .light-theme {
            --bg-color: #ffffff;
            --toolbar-color: #f0f0f0;
            --text-color: #000000;
            --accent-color: #dddddd;
            --accent-hover: #cccccc;
            --border-color: #bbbbbb;
            --icon-fill: #333333;
            --info-color: #555;
            --interactive-accent: #007acc;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            transition: background-color 0.3s;
        }

        .container { display: flex; flex-direction: column; height: 100vh; }

        header {
            background-color: var(--toolbar-color);
            padding: 8px 15px;
            display: flex; gap: 8px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        .btn-icon {
            background-color: var(--accent-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }

        .btn-icon:hover { background-color: var(--accent-hover); border-color: #555; }
        .btn-icon svg { width: 20px; height: 20px; fill: var(--icon-fill); }
        .btn-danger:hover { background-color: var(--danger-hover); border-color: #a00; }

        .info-panel { margin-left: auto; text-align: right; }
        .filename-display { font-size: 11px; font-family: 'Consolas', monospace; display: block; color: var(--text-color); }
        .cursor-pos { font-size: 10px; color: var(--info-color); font-family: 'Consolas', monospace; display: block; }

        textarea {
            flex-grow: 1; width: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: none; padding: 15px;
            box-sizing: border-box; resize: none;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 16px;
            line-height: 1.6;
            outline: none; overflow: auto;
            scrollbar-gutter: stable;
        }

        #modalHelp, #modalSettings {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center; justify-content: center;
        }

        .modal-content {
            background: var(--toolbar-color);
            color: var(--text-color);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .help-logo {
            width: 120px; height: 120px;
            margin: 0 auto 10px auto;
            display: block;
        }
        
        /* Aplica a cor do texto do tema ao seu SVG */
        .help-logo svg {
            width: 100%; height: 100%;
            fill: var(--text-color);
        }

        .modal-content h2 { margin: 0; color: var(--interactive-accent); font-size: 1.5rem; }
        .modal-content h5 { margin: 0 0 15px 0; font-weight: normal; color: var(--info-color); }
        
        .modal-content ul { text-align: left; margin: 15px 0; padding-left: 20px; font-size: 14px; }
        .modal-content li { margin-bottom: 8px; }

        .close-modal {
            margin-top: 10px; width: 100%; 
            background: var(--interactive-accent); 
            color: white;
            border: none; padding: 12px; cursor: pointer; border-radius: 4px; font-weight: bold;
            transition: background-color 0.2s;
        }
        
        .close-modal:hover { background-color: #005a9e; }

        select {
            width: 100%; padding: 10px; background: var(--bg-color); color: var(--text-color);
            border: 1px solid var(--border-color); border-radius: 4px;
        }

        textarea::-webkit-scrollbar { width: 10px; height: 10px; }
        textarea::-webkit-scrollbar-track { background: var(--bg-color); }
        textarea::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 5px; }
    </style>
</head>

<body>

<div class="container">
    <header>
        <div id="btnNew" class="btn-icon btn-danger" title="Limpar tudo">
            <svg viewBox="0 0 24 24"><path d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19V4M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z"/></svg>

        </div>

        <div class="info-panel">
            <span id="fileName" class="filename-display">sem-titulo.txt</span>
            <span id="cursorPos" class="cursor-pos">Lin 1, Col 1</span>
        </div>
    </header>

    <textarea id="editor" wrap="off" spellcheck="false" placeholder="Comece a digitar..."></textarea>
    <input type="file" id="fileInput" accept=".txt,.xml" style="display:none;">
</div>

        <h2>µPen Editor</h2>
        <h5>Versão 0.9.1</h5>
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
        <ul>
            <li><strong>Smart XML:</strong> Toggle para auto-formatação/minificação.</li>
            <li><strong>Fix Open:</strong> Permite reabrir o mesmo arquivo após limpar.</li>
        </ul>
        <button class="close-modal" onclick="document.getElementById('modalHelp').style.display='none'">Fechar Ajuda</button>
    </div>
</div>

<div id="modalSettings">
    <div class="modal-content">
        <h2>Configurações</h2>
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
        
        <div style="margin-bottom: 15px; text-align: left;">
            <label><input type="checkbox" id="minifyCheck"> Ativar Smart XML (Auto-formatar ao abrir / Minificar ao salvar)</label>
            <small style="font-size: 10px; color: var(--info-color); display: block; margin-top: 4px;">Útil para NF-e. Se desativado, o arquivo é lido como texto comum.</small>
        </div>

        <div style="margin-bottom: 15px; text-align: left;">
            <label for="themeSelector">Tema:</label>
            <select id="themeSelector">
                <option value="dark">Escuro</option>
                <option value="light">Claro</option>
            </select>
        </div>

        <button class="close-modal" id="btnSaveSettings">Salvar e Fechar</button>
    </div>
</div>

<script>
    const editor = document.getElementById('editor');
    const fileNameDisplay = document.getElementById('fileName');
    const cursorPosDisplay = document.getElementById('cursorPos');
    const fileInput = document.getElementById('fileInput');
    const minifyCheck = document.getElementById('minifyCheck');
    const themeSelector = document.getElementById('themeSelector');
    
    const STORAGE_KEY_CONTENT = 'upen_draft_content';
    const STORAGE_KEY_NAME = 'upen_draft_name';
    const STORAGE_KEY_MINIFY = 'upen_minify_xml';

    function formatXML(xml) {
        let formatted = '';
        let indent = '';
        const tab = '    ';
        xml = xml.trim().replace(/>\s+</g, '><'); 
        const nodes = xml.split(/>\s*</);
        nodes.forEach((node) => {
            if (node.match(/^\/\w/)) indent = indent.substring(tab.length);
            let line = node;
            if (!line.startsWith('<')) line = '<' + line;
            if (!line.endsWith('>')) line = line + '>';
            formatted += indent + line + '\r\n';
            if (node.match(/^<?\w[^>]*[^\/]$/) && !node.startsWith("?") && !node.startsWith("/")) indent += tab;
        });
        return formatted.trim();
    }

    function minifyXML(xml) {
        return xml.replace(/>\s+</g, '><').trim();
    }

    document.getElementById('btnOpen').onclick = () => fileInput.click();

    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            let content = ev.target.result;
            const isXML = file.name.toLowerCase().endsWith('.xml');
            
            if(isXML && minifyCheck.checked) {
                content = formatXML(content);
            }
            
            updateEditor(content, file.name);
            fileInput.value = "";
        };
        reader.readAsText(file);
    };

    document.getElementById('btnSave').onclick = () => {
        let contentToSave = editor.value;
        const isXML = fileNameDisplay.textContent.toLowerCase().endsWith('.xml');
        
        if (isXML && minifyCheck.checked) {
            contentToSave = minifyXML(contentToSave);
        }

        const blob = new Blob([contentToSave], {type: isXML ? 'text/xml' : 'text/plain'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileNameDisplay.textContent;
        a.click();
        URL.revokeObjectURL(url);
    };

    document.getElementById('btnNew').onclick = () => {
        if(confirm("Limpar tudo?")) {
            updateEditor("", "sem-titulo.txt");
            fileInput.value = "";
        }
    };

    document.getElementById('btnSettings').onclick = () => document.getElementById('modalSettings').style.display = 'flex';
    document.getElementById('btnSaveSettings').onclick = () => {
        localStorage.setItem(STORAGE_KEY_MINIFY, minifyCheck.checked);
        localStorage.setItem('upen_theme', themeSelector.value);
        applyTheme(themeSelector.value);
        document.getElementById('modalSettings').style.display = 'none';
    };
    document.getElementById('btnHelp').onclick = () => document.getElementById('modalHelp').style.display = 'flex';

    function updateEditor(content, name){
        editor.value = content;
        fileNameDisplay.textContent = name;
        localStorage.setItem(STORAGE_KEY_CONTENT, content);
        localStorage.setItem(STORAGE_KEY_NAME, name);
        updateCursorInfo();
    }

    function updateCursorInfo(){
        const pos = editor.selectionStart;
        const lines = editor.value.substr(0, pos).split("\n");
        cursorPosDisplay.textContent = `Lin ${lines.length}, Col ${lines[lines.length-1].length + 1}`;
    }

    function applyTheme(theme) { document.documentElement.classList.toggle('light-theme', theme === 'light'); }

    window.onload = () => {
        const theme = localStorage.getItem('upen_theme') || 'dark';
        applyTheme(theme);
        themeSelector.value = theme;
        const isMinify = localStorage.getItem(STORAGE_KEY_MINIFY) === 'true';
        minifyCheck.checked = isMinify;
        const c = localStorage.getItem(STORAGE_KEY_CONTENT);
        const n = localStorage.getItem(STORAGE_KEY_NAME);
        if (c) editor.value = c;
        if (n) fileNameDisplay.textContent = n;
        updateCursorInfo();
    };

    editor.oninput = () => {
        localStorage.setItem(STORAGE_KEY_CONTENT, editor.value);
        updateCursorInfo();
    };

    ['keyup','click', 'focus'].forEach(ev => editor.addEventListener(ev, updateCursorInfo));

    window.onkeydown = (e) => {
        if(e.ctrlKey && e.key === 's'){ e.preventDefault(); document.getElementById('btnSave').click(); }
    };
</script>

</body>
</html>
