<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>µPen Editor | v0.9.1</title>

    <style>
        :root {
            --bg-color: #1e1e1e;
            --toolbar-color: #2d2d2d;
            --text-color: #d4d4d4;
            --accent-color: #333333;
            --accent-hover: #454545;
            --border-color: #3c3c3c;
            --icon-fill: #cccccc;
            --danger-hover: #8e2e2e;
            --info-color: #777;
            --interactive-accent: #007acc;
        }

        .light-theme {
            --bg-color: #ffffff;
            --toolbar-color: #f0f0f0;
            --text-color: #000000;
            --accent-color: #dddddd;
            --accent-hover: #cccccc;
            --border-color: #bbbbbb;
            --icon-fill: #333333;
            --info-color: #555;
            --interactive-accent: #007acc;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            transition: background-color 0.3s;
        }

        .container { display: flex; flex-direction: column; height: 100vh; }

        header {
            background-color: var(--toolbar-color);
            padding: 8px 15px;
            display: flex; gap: 8px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        .btn-icon {
            background-color: var(--accent-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }

        .btn-icon:hover { background-color: var(--accent-hover); border-color: #555; }
        .btn-icon svg { width: 20px; height: 20px; fill: var(--icon-fill); }
        .btn-danger:hover { background-color: var(--danger-hover); border-color: #a00; }

        .info-panel { margin-left: auto; text-align: right; }
        .filename-display { font-size: 11px; font-family: 'Consolas', monospace; display: block; color: var(--text-color); }
        .cursor-pos { font-size: 10px; color: var(--info-color); font-family: 'Consolas', monospace; display: block; }

        textarea {
            flex-grow: 1; width: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: none; padding: 15px;
            box-sizing: border-box; resize: none;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 16px;
            line-height: 1.6;
            outline: none; overflow: auto;
            scrollbar-gutter: stable;
        }

        #modalHelp, #modalSettings {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center; justify-content: center;
        }

        .modal-content {
            background: var(--toolbar-color);
            color: var(--text-color);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* Área do Logotipo */
        .help-logo {
            width: 128px; height: 128px;
            margin: 0 auto 10px auto;
            display: block;
        }
        
        /* O SVG herda a cor do texto para funcionar em ambos os temas */
        .help-logo svg {
            width: 100%; height: 100%;
            fill: var(--text-color);
        }

        .modal-content h2 { margin: 0; color: var(--interactive-accent); font-size: 1.5rem; }
        .modal-content h5 { margin: 0 0 15px 0; font-weight: normal; color: var(--info-color); }
        .modal-content ul { text-align: left; margin: 15px 0; padding-left: 20px; font-size: 14px; }

        .close-modal {
            margin-top: 10px; width: 100%; 
            background: var(--interactive-accent); 
            color: white;
            border: none; padding: 12px; cursor: pointer; border-radius: 4px; font-weight: bold;
        }
        
        .close-modal:hover { background-color: #005a9e; }

        select {
            width: 100%; padding: 10px; background: var(--bg-color); color: var(--text-color);
            border: 1px solid var(--border-color); border-radius: 4px;
        }
    </style>
</head>

<body>

<div class="container">
    <header>
        <div id="btnNew" class="btn-icon btn-danger" title="Limpar tudo">
            <svg viewBox="0 0 24 24"><path d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19V4M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z"/></svg>
        </div>

        </div>

        </div>
        <div id="btnHelp" class="btn-icon" title="Ajuda">
            <svg viewBox="0 0 24 24"><path d="M11,18H13V16H11V18M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,20C7.59,20 4,16.41 4,12C4,7.59 7.59,4 12,4C16.41,4 20,7.59 20,12C20,16.41 16.41,20 12,20M12,6A4,4 0 0,0 8,10H10A2,2 0 0,1 12,8A2,2 0 0,1 14,10C14,12 11,11.75 11,15H13C13,12.75 16,12.5 16,10A4,4 0 0,0 12,6Z"/></svg>
        </div>

        <div class="info-panel">
            <span id="fileName" class="filename-display">sem-titulo.txt</span>
            <span id="cursorPos" class="cursor-pos">Lin 1, Col 1</span>
        </div>
    </header>

    <textarea id="editor" wrap="off" spellcheck="false" placeholder="Comece a digitar..."></textarea>
    <input type="file" id="fileInput" accept=".txt,.xml" style="display:none;">
</div>

<div id="modalHelp">
    <div class="modal-content">
        <div class="help-logo">
            <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">

 1.4-33.1 1.4z"/>
            </svg>
        </div>
        
        <h2>µPen Editor</h2>
        <h5>Versão 0.9.1</h5>
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
        <ul>
            <li><strong>Smart XML:</strong> Toggle para auto-formatação/minificação.</li>
            <li><strong>Fix Open:</strong> Permite reabrir o mesmo arquivo após limpar.</li>
        </ul>
        <button class="close-modal" onclick="document.getElementById('modalHelp').style.display='none'">Fechar Ajuda</button>
    </div>
</div>

<div id="modalSettings">
    <div class="modal-content">
        <h2>Configurações</h2>
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
        <div style="text-align: left; margin-bottom: 15px;">
            <label><input type="checkbox" id="minifyCheck"> Ativar Smart XML</label>
        </div>
        <div style="text-align: left; margin-bottom: 15px;">
            <label for="themeSelector">Tema:</label>
            <select id="themeSelector">
                <option value="dark">Escuro</option>
                <option value="light">Claro</option>
            </select>
        </div>
        <button class="close-modal" id="btnSaveSettings">Salvar e Fechar</button>
    </div>
</div>

<script>
    // Script básico para funcionamento dos botões e modais
    const editor = document.getElementById('editor');
    const fileInput = document.getElementById('fileInput');

    document.getElementById('btnHelp').onclick = () => document.getElementById('modalHelp').style.display = 'flex';
    document.getElementById('btnSettings').onclick = () => document.getElementById('modalSettings').style.display = 'flex';
    document.getElementById('btnSaveSettings').onclick = () => {
        applyTheme(document.getElementById('themeSelector').value);
        document.getElementById('modalSettings').style.display = 'none';
    };

    function applyTheme(theme) { document.documentElement.classList.toggle('light-theme', theme === 'light'); }
    
    // Funções simplificadas para exemplo
    document.getElementById('btnOpen').onclick = () => fileInput.click();
    document.getElementById('btnNew').onclick = () => { if(confirm("Limpar?")) editor.value = ""; fileInput.value = ""; };
</script>

</body>
</html>
