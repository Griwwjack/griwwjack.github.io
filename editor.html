<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Text Editor - No Wrap</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --toolbar-color: #2d2d2d;
            --text-color: #d4d4d4;
            --accent-color: #007acc;
            --accent-hover: #005a9e;
            --border-color: #3c3c3c;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--toolbar-color);
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
            z-index: 10;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .filename-display {
            margin-left: auto;
            font-size: 12px;
            color: #888;
        }

        main {
            flex-grow: 1;
            position: relative;
        }

        textarea {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: none;
            padding: 20px;
            box-sizing: border-box;
            resize: none;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 16px;
            line-height: 1.5;
            outline: none;
            
            /* Desabilitando quebra automática */
            white-space: pre;
            overflow: auto;
        }

        /* Scrollbars customizadas */
        textarea::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }
        textarea::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        textarea::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border: 3px solid var(--bg-color);
            border-radius: 10px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <button id="btnOpen">Abrir Arquivo</button>
        <button id="btnSave">Salvar Como</button>
        <span id="fileName" class="filename-display">Novo arquivo.txt</span>
    </header>
    <main>
        <textarea id="editor" wrap="off" spellcheck="false" placeholder="Modo sem quebra de linha..."></textarea>
    </main>
</div>

<script>
    const btnOpen = document.getElementById('btnOpen');
    const btnSave = document.getElementById('btnSave');
    const editor = document.getElementById('editor');
    const fileNameDisplay = document.getElementById('fileName');

    btnOpen.addEventListener('click', async () => {
        try {
            if ('showOpenFilePicker' in window) {
                const [fileHandle] = await window.showOpenFilePicker({
                    types: [{ description: 'Texto', accept: { 'text/plain': ['.txt'] } }]
                });
                const file = await fileHandle.getFile();
                editor.value = await file.text();
                fileNameDisplay.textContent = file.name;
            } else {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.txt';
                input.onchange = e => {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = ev => {
                        editor.value = ev.target.result;
                        fileNameDisplay.textContent = file.name;
                    };
                    reader.readAsText(file);
                };
                input.click();
            }
        } catch (err) {}
    });

    btnSave.addEventListener('click', async () => {
        const content = editor.value;
        try {
            if ('showSaveFilePicker' in window) {
                const handle = await window.showSaveFilePicker({
                    suggestedName: 'arquivo.txt',
                    types: [{ description: 'Texto', accept: { 'text/plain': ['.txt'] } }]
                });
                const writable = await handle.createWritable();
                await writable.write(content);
                await writable.close();
                fileNameDisplay.textContent = handle.name;
            } else {
                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'arquivo.txt';
                a.click();
                URL.revokeObjectURL(url);
            }
        } catch (err) {}
    });

    window.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 's') {
            e.preventDefault();
            btnSave.click();
        }
    });
</script>

</body>
</html>
