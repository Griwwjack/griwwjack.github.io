<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Pad - Pro</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --toolbar-color: #2d2d2d;
            --text-color: #d4d4d4;
            --accent-color: #333333;
            --accent-hover: #454545;
            --border-color: #3c3c3c;
            --icon-fill: #cccccc;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--toolbar-color);
            padding: 8px 15px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        .btn-icon {
            background-color: var(--accent-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background-color: var(--accent-hover);
            border-color: #555;
        }

        .btn-icon svg {
            width: 20px;
            height: 20px;
            fill: var(--icon-fill);
        }

        .filename-display {
            margin-left: auto;
            font-size: 11px;
            color: #666;
            font-family: monospace;
        }

        textarea {
            flex-grow: 1;
            width: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: none;
            padding: 15px;
            box-sizing: border-box;
            resize: none;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 15px;
            line-height: 1.6;
            outline: none;
            white-space: pre;
            overflow: auto;
        }

        /* Scrollbar Style */
        textarea::-webkit-scrollbar { width: 10px; height: 10px; }
        textarea::-webkit-scrollbar-track { background: var(--bg-color); }
        textarea::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div id="btnOpen" class="btn-icon" title="Abrir arquivo">
            <svg viewBox="0 0 24 24"><path d="M20,18H4V8H20M20,6H12L10,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V8C22,6.89 21.1,6 20,6Z" /></svg>
        </div>
        
        <div id="btnSave" class="btn-icon" title="Salvar">
            <svg viewBox="0 0 24 24"><path d="M15,9H5V5H15M12,19A3,3 0 0,1 9,16A3,3 0 0,1 12,13A3,3 0 0,1 15,16A3,3 0 0,1 12,19M17,3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V7L17,3Z" /></svg>
        </div>

        <span id="fileName" class="filename-display">sem-titulo.txt</span>
    </header>
    
    <textarea id="editor" wrap="off" spellcheck="false" placeholder="Digite seu texto..."></textarea>
</div>

<script>
    const btnOpen = document.getElementById('btnOpen');
    const btnSave = document.getElementById('btnSave');
    const editor = document.getElementById('editor');
    const fileNameDisplay = document.getElementById('fileName');

    // Lógica de Abrir
    btnOpen.onclick = async () => {
        try {
            if ('showOpenFilePicker' in window) {
                const [handle] = await window.showOpenFilePicker();
                const file = await handle.getFile();
                editor.value = await file.text();
                fileNameDisplay.textContent = file.name;
            } else {
                const input = document.createElement('input');
                input.type = 'file';
                input.onchange = e => {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = ev => {
                        editor.value = ev.target.result;
                        fileNameDisplay.textContent = file.name;
                    };
                    reader.readAsText(file);
                };
                input.click();
            }
        } catch (e) {}
    };

    // Lógica de Salvar
    btnSave.onclick = async () => {
        const content = editor.value;
        try {
            if ('showSaveFilePicker' in window) {
                const handle = await window.showSaveFilePicker({
                    suggestedName: fileNameDisplay.textContent,
                    types: [{ description: 'Txt', accept: {'text/plain': ['.txt']} }]
                });
                const writable = await handle.createWritable();
                await writable.write(content);
                await writable.close();
                fileNameDisplay.textContent = handle.name;
            } else {
                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileNameDisplay.textContent;
                a.click();
                URL.revokeObjectURL(url);
            }
        } catch (e) {}
    };

    // Atalho Ctrl+S
    window.onkeydown = (e) => {
        if (e.ctrlKey && e.key === 's') {
            e.preventDefault();
            btnSave.click();
        }
    };
</script>

</body>
</html>
