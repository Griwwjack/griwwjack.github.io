<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Pad - Pro (Engineer Edition)</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --toolbar-color: #2d2d2d;
            --text-color: #d4d4d4;
            --accent-color: #333333;
            --accent-hover: #454545;
            --border-color: #3c3c3c;
            --icon-fill: #cccccc;
            --info-color: #888;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        .container { display: flex; flex-direction: column; height: 100vh; }

        header {
            background-color: var(--toolbar-color);
            padding: 8px 15px;
            display: flex; gap: 12px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        .btn-icon {
            background-color: var(--accent-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }

        .btn-icon:hover { background-color: var(--accent-hover); border-color: #555; }
        .btn-icon svg { width: 20px; height: 20px; fill: var(--icon-fill); }

        .info-panel {
            margin-left: auto;
            text-align: right;
            line-height: 1.2;
        }

        .filename-display {
            font-size: 11px;
            color: var(--text-color);
            font-family: 'Consolas', monospace;
            display: block;
        }

        .cursor-pos {
            font-size: 10px;
            color: var(--info-color);
            font-family: 'Consolas', monospace;
            display: block;
        }

        textarea {
            flex-grow: 1; width: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: none; padding: 15px;
            box-sizing: border-box; resize: none;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 15px; line-height: 1.6;
            outline: none; white-space: pre; overflow: auto;
        }

        /* Scrollbar */
        textarea::-webkit-scrollbar { width: 10px; height: 10px; }
        textarea::-webkit-scrollbar-track { background: var(--bg-color); }
        textarea::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div id="btnOpen" class="btn-icon" title="Abrir arquivo">
            <svg viewBox="0 0 24 24"><path d="M20,18H4V8H20M20,6H12L10,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V8C22,6.89 21.1,6 20,6Z" /></svg>
        </div>
        
        <div id="btnSave" class="btn-icon" title="Salvar">
            <svg viewBox="0 0 24 24"><path d="M15,9H5V5H15M12,19A3,3 0 0,1 9,16A3,3 0 0,1 12,13A3,3 0 0,1 15,16A3,3 0 0,1 12,19M17,3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V7L17,3Z" /></svg>
        </div>

        <div class="info-panel">
            <span id="fileName" class="filename-display">sem-titulo.txt</span>
            <span id="cursorPos" class="cursor-pos">Lin 1, Col 1</span>
        </div>
    </header>
    
    <textarea id="editor" wrap="off" spellcheck="false" placeholder="Inicie a edição..."></textarea>
</div>

<script>
    const btnOpen = document.getElementById('btnOpen');
    const btnSave = document.getElementById('btnSave');
    const editor = document.getElementById('editor');
    const fileNameDisplay = document.getElementById('fileName');
    const cursorPosDisplay = document.getElementById('cursorPos');

    const STORAGE_KEY_CONTENT = 'webpad_draft_content';
    const STORAGE_KEY_NAME = 'webpad_draft_name';

    // Recuperação Inicial
    window.addEventListener('DOMContentLoaded', () => {
        const savedContent = localStorage.getItem(STORAGE_KEY_CONTENT);
        const savedName = localStorage.getItem(STORAGE_KEY_NAME);
        if (savedContent) editor.value = savedContent;
        if (savedName) fileNameDisplay.textContent = savedName + " (recuperado)";
        updateCursorInfo();
    });

    // Atualiza linha e coluna
    function updateCursorInfo() {
        const text = editor.value;
        const pos = editor.selectionStart;
        const lines = text.substr(0, pos).split("\n");
        const currentLine = lines.length;
        const currentCol = lines[lines.length - 1].length + 1;
        cursorPosDisplay.textContent = `Lin ${currentLine}, Col ${currentCol}`;
    }

    // Eventos para rastrear o cursor
    editor.addEventListener('input', () => {
        localStorage.setItem(STORAGE_KEY_CONTENT, editor.value);
        localStorage.setItem(STORAGE_KEY_NAME, fileNameDisplay.textContent.replace(" (recuperado)", ""));
        updateCursorInfo();
    });
    
    editor.addEventListener('keyup', updateCursorInfo);
    editor.addEventListener('click', updateCursorInfo);
    editor.addEventListener('selectionchange', updateCursorInfo);

    // Lógica Abrir/Salvar (Simplificada)
    btnOpen.onclick = async () => {
        try {
            const [handle] = await window.showOpenFilePicker();
            const file = await handle.getFile();
            updateEditor(await file.text(), file.name);
        } catch (e) { /* Fallback manual omitido para brevidade, mas API moderna cobre Chrome/Edge/Opera */ }
    };

    btnSave.onclick = async () => {
        try {
            const handle = await window.showSaveFilePicker({
                suggestedName: fileNameDisplay.textContent.replace(" (recuperado)", ""),
                types: [{ description: 'Txt', accept: {'text/plain': ['.txt']} }]
            });
            const writable = await handle.createWritable();
            await writable.write(editor.value);
            await writable.close();
            updateEditor(editor.value, handle.name);
        } catch (e) {}
    };

    function updateEditor(content, name) {
        editor.value = content;
        fileNameDisplay.textContent = name;
        localStorage.setItem(STORAGE_KEY_CONTENT, content);
        localStorage.setItem(STORAGE_KEY_NAME, name);
        updateCursorInfo();
    }

    window.onkeydown = (e) => { if (e.ctrlKey && e.key === 's') { e.preventDefault(); btnSave.click(); } };
</script>

</body>
</html>
