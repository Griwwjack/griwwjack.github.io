<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor TXT Dark</title>
    <style>
        /* Reset e Estilo Base */
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212; /* Fundo Ultra Dark */
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        /* Barra de Ferramentas */
        .toolbar {
            width: 90%;
            max-width: 900px;
            display: flex;
            gap: 15px;
            background-color: #1e1e1e;
            padding: 12px 20px;
            border-radius: 8px 8px 0 0;
            border-bottom: 1px solid #333;
        }

        /* Estilo dos Botões */
        button {
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #2d2d2d;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        button:hover {
            background-color: #3d3d3d;
            border-color: #666;
        }

        .btn-save { background-color: #0d47a1; border-color: #1565c0; }
        .btn-save:hover { background-color: #1565c0; }

        /* Área do Editor */
        #editor {
            width: 90%;
            max-width: 900px;
            flex-grow: 1;
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border: none;
            border-radius: 0 0 8px 8px;
            outline: none;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.5;
            resize: none; /* Remove o handle de redimensionamento do textarea */
            margin-bottom: 20px;
        }

        /* Input de arquivo escondido */
        #file-input { display: none; }
    </style>
</head>
<body>

    <div class="toolbar">
        <button onclick="document.getElementById('file-input').click()">
            📂 Abrir Arquivo
        </button>
        <button class="btn-save" onclick="saveFile()">
            💾 Salvar (.txt)
        </button>
        <input type="file" id="file-input" accept=".txt,.html,.js,.css" onchange="loadFile(event)">
    </div>

    <textarea id="editor" placeholder="
javascript:(function() {
    /* Seleciona a div que contém os dados no ABNET WMS */
    const dataDiv = document.querySelector('.main table');
    if (!dataDiv) {
        alert('Tabela de dados não encontrada!');
        return;
    }

    /* Cria a estrutura da nova janela */
    const newWin = window.open('', '_blank');
    newWin.document.write(`
        <html>
        <head>
            <title>Relatório - Pedidos em Clasificador</title>
            <style>
                body { font-family: Arial, sans-serif; font-size: 12px; padding: 20px; }
                table { border-collapse: collapse; width: 100%; border: 1px solid #444; }
                th { background-color: #2c3e50; color: white; padding: 10px; border: 1px solid #444; }
                td { padding: 8px; border: 1px solid #ccc; text-align: left; }
                tr:nth-child(even) { background-color: #f9f9f9; }
                .header-info { margin-bottom: 20px; border-bottom: 2px solid #2c3e50; padding-bottom: 10px; }
            </style>
        </head>
        <body>
            <div class="header-info">
                <h1>Pedidos em Clasificador</h1>
                <p>Extraído em: ${new Date().toLocaleString()}</p>
            </div>
            <table id="resultTable"></table>
        </body>
        </html>
    `);

    const destTable = newWin.document.getElementById('resultTable');

    /* Varre as linhas da tabela original */
    const rows = dataDiv.querySelectorAll('tr');
    rows.forEach((row) => {
        /* Pula a linha que contém o botão 'Refrescar' */
        if (row.querySelector('input[type="submit"]')) return;

        const newRow = destTable.insertRow();
        
        /* Captura tanto TH quanto TD */
        const cells = row.querySelectorAll('th, td');
        
        cells.forEach((cell) => {
            const newCell = newRow.insertCell();
            /* Pega apenas o texto, ignorando inputs ocultos e imagens de ordenação */
            let cleanText = cell.innerText.replace(/[\n\r]+/g, ' ').trim();
            
            /* Se for cabeçalho, transforma em negrito na nova tabela */
            if (cell.tagName === 'TH') {
                newCell.outerHTML = `<th>${cleanText}</th>`;
            } else {
                newCell.innerText = cleanText;
            }
        });
    });

    newWin.document.close();
})();

"></textarea>

    <script>
        const editor = document.getElementById('editor');

        // Função para Abrir o arquivo
        function loadFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                editor.value = e.target.result;
            };
            reader.readAsText(file);
        }

        // Função para Salvar o arquivo
        function saveFile() {
            const text = editor.value;
            const blob = new Blob([text], { type: 'text/plain' });
            const a = document.createElement('a');
            
            // Define o nome padrão do arquivo
            a.download = "meu_arquivo.txt";
            a.href = URL.createObjectURL(blob);
            
            // Dispara o download
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            // Limpa o cache do objeto URL
            setTimeout(() => URL.revokeObjectURL(a.href), 100);
        }

        // Atalho de teclado: Ctrl + S para salvar
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveFile();
            }
        });
    </script>

</body>
</html>
