<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Hub de Ferramentas</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; padding: 20px; }
        .grid { 
            display: grid; /* Garante que em telas muito pequenas ele use apenas 1 coluna */
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 15px; 
        }
//        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .card { 
            background: #333; padding: 20px; border-radius: 8px; text-align: center;
            text-decoration: none; color: #00ff00; border: 1px solid #444; transition: 0.3s;
        }
        .card:hover { background: #444; border-color: #00ff00; scale: 1.05; }
    </style>
</head>
<body>
    <h1>Hub de Ferramentas</h1>
    <hr>
    <div class="grid">
        <a href="https://griwwjack.github.io/editor.html" class="card">Web Pad</a>
        <a href="https://griwwjack.github.io/conversor.html" class="card">Conversor Numérico</a>
        <a href="https://griwwjack.github.io/sorter_counter.html" class="card">Sorter Contador</a>
        </div>
</body>
</html>
