<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Injetor Dashboard Sorter 2.0</title>
    <style>

            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 16px;

            border: 1px solid #333;
            text-align: center;

        .bookmark-btn {
            display: inline-block;
            background: #0d47a1;
            color: white !important;
            padding: 16px 32px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            cursor: move;
            text-transform: uppercase;
            border: 1px solid #1976d2;
        }
        .bookmark-btn:hover { background: #1565c0; }
        .footer { margin-top: 30px; font-size: 10px; color: #444; }
    </style>
</head>
<body>

<div class="card">
    <h1>Dashboard Injetor</h1>
    <p>Arraste o botão azul para sua barra de favoritos.</p>
