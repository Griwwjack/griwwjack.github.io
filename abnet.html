<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Injetor Dashboard Sorter 2.0</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
            width: 400px;
        }
        h1 { color: #90caf9; margin-bottom: 10px; font-weight: 300; }
        p { line-height: 1.6; margin-bottom: 30px; color: #aaa; font-size: 14px; }
        .btn-bookmark {
            display: inline-block;
            padding: 15px 30px;
            background: #0d47a1;
            color: white !important;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            cursor: move;
            transition: all 0.2s;
            border: 1px solid #1976d2;
            text-transform: uppercase;
        }
        .btn-bookmark:hover { background: #1565c0; transform: scale(1.05); }
        .footer { margin-top: 30px; font-size: 11px; color: #444; }
    </style>
</head>
<body>

<div class="container">
    <h1>Dashboard Injetor</h1>
    <p>Arraste o botão azul para sua barra de favoritos.</p>
    
    <a id="meuFavorito" class="btn-bookmark" href="#">SORTER DASHBOARD</a>

    <p class="footer">Versão 2.0 | Persistência Local | 2026</p>
</div>

<script>
    // O código JavaScript purinho aqui, sem chance de quebrar o HTML
    var jsCode = "";

    // Injeta o código no link ao carregar a página
    document.getElementById('meuFavorito').href = jsCode;
</script>

</body>
</html>
