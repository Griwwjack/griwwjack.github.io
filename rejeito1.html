<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTADOR DE REJEITOS</title>
    <style>
        :root {
            --bg-body: #121212;
            --bg-container: #1e1e1e;
            --bg-card: #2d2d2d;
            --text-main: #e0e0e0;
            --text-sub: #b0b0b0;
            --success: #2e7d32;
            --danger: #c62828;
            --warning: #f9a825;
            --info: #0288d1;
            --avaria: #8e44ad;
            --border: #444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .container {
            max-width: 95%;
            width: 850px;
            background: var(--bg-container);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        h1 { text-align: center; color: var(--text-main); margin: 10px 0 5px 0; font-size: 1.5rem; }
        
        .onda-atual-badge {
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
            color: var(--info);
            font-size: 1.1rem;
        }

        .grid-contadores {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--bg-card);
            padding: 15px 5px;
            border-radius: 12px;
            text-align: center;
            border-bottom: 5px solid #555;
        }

        .card h3 { margin: 0; font-size: 11px; text-transform: uppercase; color: var(--text-sub); min-height: 30px; display: flex; align-items: center; justify-content: center; }
        .card .numero { font-size: 32px; font-weight: bold; display: block; margin: 5px 0; color: #fff; }

        .controles { display: flex; justify-content: center; gap: 5px; padding: 0 5px; }

        .btn {
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            color: white;
        }

        .btn-add { background-color: var(--success); flex-grow: 2; }
        .btn-sub { background-color: #555; color: #eee; flex-grow: 1; }

        .card.boa { border-color: var(--success); }
        .card.ruins { border-color: var(--danger); }
        .card.rasgada { border-color: var(--warning); }
        .card.amassada { border-color: var(--info); }
        .card.vazia { border-color: #7f8c8d; }
        .card.avaria { border-color: var(--avaria); }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 12px;
            width: 280px;
            border: 2px solid var(--info);
        }

        .modal-content h2 { font-size: 1rem; margin-top: 0; color: var(--info); text-align: center; }
        
        .radio-box {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .radio-box label { display: block; margin: 5px 0; cursor: pointer; font-size: 14px; }
        
        .modal-input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: #1e1e1e;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .modal-footer { display: flex; gap: 10px; }
        .btn-confirm { background: var(--success); color: white; border: none; padding: 10px; border-radius: 5px; flex: 1; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: #c62828; color: white; border: none; padding: 10px; border-radius: 5px; flex: 1; cursor: pointer; }

        .acoes-final {
            border-top: 1px solid var(--border);
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-salvar-onda { background-color: var(--success); padding: 12px; font-size: 16px; width: 100%; color: white; cursor: pointer; border: none; font-weight: bold; }
        .btn-finalizar-geral { background-color: #37474f; padding: 15px; font-size: 18px; width: 100%; border: 2px solid #546e7a; color: white; cursor: pointer; font-weight: bold; }

        .relatorio-area { margin-top: 30px; width: 100%; max-width: 850px; overflow-x: auto; }
        table { width: 100%; min-width: 500px; border-collapse: collapse; background: var(--bg-container); color: var(--text-main); }
        th { background: #333; color: var(--info); padding: 10px; font-size: 13px; border: 1px solid var(--border); }
        td { padding: 10px; border: 1px solid var(--border); font-family: monospace; font-size: 11px; white-space: pre-wrap; vertical-align: top; }
        tr:nth-child(even) { background: #252525; }

        .footer-admin { margin-top: 40px; padding: 15px; opacity: 0.3; }
        .footer-admin:hover { opacity: 1; }
        .btn-limpar { background: none; border: 1px solid #444; color: #777; font-size: 10px; padding: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h1>CONTADOR DE REJEITOS</h1>
        <div class="onda-atual-badge">ONDA ATUAL: <span id="onda-numero-display">01</span></div>
        
        <div class="grid-contadores">
            <div class="card boa">
                <h3>Etiqueta Boa</h3>
                <span class="numero" id="v-boa">0</span>
                <div class="controles">
                    <button class="btn btn-sub" onclick="alterar('boa', -1)">-</button>
                    <button class="btn btn-add" onclick="alterar('boa', 1)">+</button>
                </div>
            </div>

            <div class="card ruins">
                <h3>Etiqueta Ruim</h3>
                <span class="numero" id="v-ruim">0</span>
                <div class="controles">
                    <button class="btn btn-sub" onclick="alterar('ruim', -1)">-</button>
                    <button class="btn btn-add" onclick="alterar('ruim', 1)">+</button>
                </div>
            </div>

            <div class="card rasgada">
                <h3>Etiqueta Rasgada</h3>
                <span class="numero" id="v-rasgada">0</span>
                <div class="controles">
                    <button class="btn btn-sub" onclick="alterar('rasgada', -1)">-</button>
                    <button class="btn btn-add" onclick="abrirModal('rasgada')">+</button>
                </div>
            </div>

            <div class="card amassada">
                <h3>Etiqueta Amassada</h3>
                <span class="numero" id="v-amassada">0</span>
                <div class="controles">
                    <button class="btn btn-sub" onclick="alterar('amassada', -1)">-</button>
                    <button class="btn btn-add" onclick="abrirModal('amassada')">+</button>
                </div>
            </div>

            <div class="card vazia">
                <h3>Sem Etiqueta</h3>
                <span class="numero" id="v-sem">0</span>
                <div class="controles">
                    <button class="btn btn-sub" onclick="alterar('sem', -1)">-</button>
                    <button class="btn btn-add" onclick="alterar('sem', 1)">+</button>
                </div>
            </div>

            <div class="card avaria">
                <h3>Avaria</h3>
                <span class="numero" id="v-avaria">0</span>
                <div class="controles">
                    <button class="btn btn-sub" onclick="alterar('avaria', -1)">-</button>
                    <button class="btn btn-add" onclick="abrirModal('avaria')">+</button>
                </div>
            </div>
        </div>

        <div id="monitor-abnet" style="margin-top:20px; padding:15px; background:#000; border-radius:12px; border:1px solid #444;">
            <div style="display:flex; justify-content:space-between; color:#0288d1; font-size:12px; font-weight:bold; margin-bottom:10px;">
                <span>ABNET MONITOR</span>
                <span>TOTAL: <span id="abnet-total">0</span> | CLASSIF: <span id="abnet-classif">0</span> | <span style="color:#00ff00">PROGRESSO: <span id="abnet-porcentagem">0%</span></span></span>
            </div>
            <div id="shuts-box" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(80px, 1fr)); gap:8px; max-height:150px; overflow-y:auto;">
            </div>
        </div>

        <div class="acoes-final">
            <button class="btn btn-salvar-onda" onclick="finalizarOnda()">SALVAR ONDA</button>
            <button class="btn btn-finalizar-geral" onclick="finalizarOperacaoCompleta()">FINALIZAR OPERAÇÃO</button>
        </div>
    </div>

    <div id="modalInfo" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modalTitle">Título</h2>
            <div class="radio-box" id="modalRadios">
                <label><input type="radio" name="opcao" value="RUA" id="radioRua" checked> Rua</label>
                <label id="labelChute"><input type="radio" name="opcao" value="CHUTE"> Chute</label>
            </div>
            <input type="text" id="modalInput" class="modal-input" placeholder="Digite o número...">
            <div class="modal-footer">
                <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button class="btn-confirm" onclick="confirmarModal()">Confirmar</button>
            </div>
        </div>
    </div>

    <div class="relatorio-area">
        <h2 style="color: var(--text-main); font-size: 1.2rem;">Histórico das Ondas</h2>
        <table id="tabela-relatorio">
            <thead>
                <tr><th width="50">Onda</th><th>Relatório Detalhado</th></tr>
            </thead>
            <tbody id="corpo-relatorio"></tbody>
        </table>
    </div>

    <div class="footer-admin">
        <button class="btn-limpar" onclick="limparTudo()">APAGAR TUDO E REINICIAR</button>
    </div>

    <script>
        let contagem = { boa: 0, ruim: 0, rasgada: 0, amassada: 0, sem: 0, avaria: 0 };
        let obsAtual = [];
        let historico = [];
        let proximaOnda = 1;
        let tipoModal = "";

        window.onload = function() {
            const sC = localStorage.getItem('contagemAtual');
            const sH = localStorage.getItem('historicoOndas');
            const sO = localStorage.getItem('proximaOnda');
            const sObs = localStorage.getItem('obsAtual');
            if (sC) contagem = JSON.parse(sC);
            if (sH) historico = JSON.parse(sH);
            if (sO) proximaOnda = parseInt(sO);
            if (sObs) obsAtual = JSON.parse(sObs);
            atualizarTela();
            renderizarHistorico();
            setInterval(atualizarDadosAbnet, 3000);
        };

        function atualizarDadosAbnet() {
            fetch('dados_abnet.txt?t=' + new Date().getTime())
                .then(r => r.text())
                .then(data => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(data, 'text/html');
                    const rows = doc.querySelectorAll('table tr');
                    
                    const totalRejeitosRegistrados = contagem.boa + contagem.ruim + contagem.rasgada + 
                                                   contagem.amassada + contagem.sem + contagem.avaria;

                    let html = `<div style="background:#1a1a1a; border:1px solid #8e44ad; padding:5px; border-radius:4px; text-align:center; font-size:11px;">
                                    AVARIAS<br><b style="color:#8e44ad">${totalRejeitosRegistrados}</b>
                                 </div>`;
                    
                    let tG = 0; let cG = 0;

                    if (rows.length <= 1) {
                        document.getElementById('shuts-box').innerHTML = html + `
                            <div style="grid-column: 2 / -1; text-align: center; color: #555; padding: 10px; font-size: 11px;">
                                AGUARDANDO INÍCIO DA ONDA...
                            </div>`;
                        document.getElementById('abnet-total').innerText = "0";
                        document.getElementById('abnet-classif').innerText = "0";
                        document.getElementById('abnet-porcentagem').innerText = "0%";
                        return;
                    }

                    rows.forEach((row, index) => {
                        if(index > 0) {
                            const cols = row.querySelectorAll('td');
                            if(cols.length >= 4) {
                                const chute = cols[1].innerText.trim();
                                const total = parseInt(cols[2].innerText) || 0;
                                const classif = parseInt(cols[3].innerText) || 0;
                                
                                if(chute !== "") {
                                    tG += total; cG += classif;
                                    const cor = (classif >= total && total > 0) ? '#2e7d32' : '#f9a825';
                                    html += `<div style="background:#1a1a1a; border:1px solid ${cor}; padding:5px; border-radius:4px; text-align:center; font-size:11px;">
                                                Shut ${chute}<br><b style="color:${cor}">${classif}/${total}</b>
                                             </div>`;
                                }
                            }
                        }
                    });
                    document.getElementById('shuts-box').innerHTML = html;
                    document.getElementById('abnet-total').innerText = tG;
                    document.getElementById('abnet-classif').innerText = cG;
                    let porcentagem = (tG > 0) ? ((cG / tG) * 100).toFixed(1) : 0;
                    document.getElementById('abnet-porcentagem').innerText = porcentagem + "%";
                }).catch(e => {
                    document.getElementById('shuts-box').innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #c62828; font-size: 10px;">ERRO DE CONEXÃO COM O MOTOR</div>';
                });
        }

        function finalizarOnda() {
            if (confirm(`Deseja salvar a Onda ${proximaOnda}?`)) {
                let agora = new Date().toLocaleString('pt-BR');
                let totalRejeitos = contagem.boa + contagem.ruim + contagem.rasgada + contagem.amassada + contagem.sem + contagem.avaria;
                
                let texto = `============================================================\n`;
                texto += `   ONDA ${proximaOnda.toString().padStart(2, '0')} - RELATÓRIO DE OPERAÇÃO\n`;
                texto += `   Data/Hora: ${agora}\n`;
                texto += `============================================================\n\n`;
                
                texto += `RESUMO DE REJEITOS (MANUAL)\n`;
                texto += `------------------------------------------------------------\n`;
                texto += ` Boa: ${contagem.boa.toString().padEnd(14)} Ruim: ${contagem.ruim.toString().padEnd(13)} Rasgada: ${contagem.rasgada}\n`;
                texto += ` Amassada: ${contagem.amassada.toString().padEnd(10)} Sem Etiq: ${contagem.sem.toString().padEnd(10)} Avaria: ${contagem.avaria}\n`;
                texto += ` TOTAL DE AVARIAS REGISTRADAS: ${totalRejeitos}\n\n`;

                if (obsAtual.length > 0) {
                    texto += ` DETALHAMENTO DE REJEITOS:\n`;
                    obsAtual.forEach(o => {
                        texto += `  - ${o.tipo.toUpperCase()} (${o.subtipo}): ${o.valor}\n`;
                    });
                    texto += `\n`;
                }

                texto += `DADOS DO SORTER (ABNET)\n`;
                texto += `------------------------------------------------------------\n`;
                texto += ` CHUTE      TOTAL DE ITENS      ITENS CLASS.      STATUS\n`;
                
                const cards = document.querySelectorAll('#shuts-box div');
                let totalGeralSorter = 0;
                let totalClassifSorter = 0;

                cards.forEach(card => {
                    const txt = card.innerText;
                    if (txt.includes('Shut')) {
                        const linhas = txt.split('\n');
                        const nomeChute = linhas[0];
                        const valores = linhas[1].split('/');
                        const classif = parseInt(valores[0]) || 0;
                        const total = parseInt(valores[1]) || 0;
                        
                        totalGeralSorter += total;
                        totalClassifSorter += classif;

                        let status = (classif >= total && total > 0) ? "OK" : "PENDENTE";
                        texto += ` ${nomeChute.padEnd(10)} ${total.toString().padEnd(19)} ${classif.toString().padEnd(17)} ${status}\n`;
                    }
                });

                let porcentagemOnda = (totalGeralSorter > 0) ? ((totalClassifSorter / totalGeralSorter) * 100).toFixed(1) : 0;
                texto += `------------------------------------------------------------\n`;
                texto += ` TOTAL GERAL: ${totalGeralSorter.toString().padEnd(13)} TOTAL CLASS: ${totalClassifSorter}\n`;
                texto += ` PROGRESSO DA ONDA: ${porcentagemOnda}%\n`;
                texto += `============================================================\n\n\n`;

                historico.unshift({ id: proximaOnda, conteudo: texto });
                proximaOnda++;
                contagem = { boa: 0, ruim: 0, rasgada: 0, amassada: 0, sem: 0, avaria: 0 };
                obsAtual = [];
                salvarNoNavegador();
                atualizarTela();
                renderizarHistorico();
            }
        }

        function finalizarOperacaoCompleta() {
            if (confirm("Isso baixará o relatório completo de todas as ondas. Confirma?")) {
                let cF = "REPORTE CONSOLIDADO DE PRODUÇÃO - SORTER\r\n";
                cF += "EMISSÃO: " + new Date().toLocaleString('pt-BR') + "\r\n";
                cF += "============================================================\r\n\r\n";
                
                [...historico].reverse().forEach(item => {
                    cF += item.conteudo.replace(/\n/g, "\r\n");
                });
                
                const blob = new Blob([cF], { type: 'text/plain;charset=utf-8' });
                const link = document.createElement('a');
                link.href = window.URL.createObjectURL(blob);
                link.download = `Relatorio_Producao_${new Date().toLocaleDateString().replace(/\//g, '-')}.txt`;
                link.click();
                limparDadosSistema();
            }
        }

        function salvarNoNavegador() {
            localStorage.setItem('contagemAtual', JSON.stringify(contagem));
            localStorage.setItem('historicoOndas', JSON.stringify(historico));
            localStorage.setItem('proximaOnda', proximaOnda.toString());
            localStorage.setItem('obsAtual', JSON.stringify(obsAtual));
        }

        function atualizarTela() {
            document.getElementById('v-boa').innerText = contagem.boa;
            document.getElementById('v-ruim').innerText = contagem.ruim;
            document.getElementById('v-rasgada').innerText = contagem.rasgada;
            document.getElementById('v-amassada').innerText = contagem.amassada;
            document.getElementById('v-sem').innerText = contagem.sem;
            document.getElementById('v-avaria').innerText = contagem.avaria;
            document.getElementById('onda-numero-display').innerText = proximaOnda.toString().padStart(2, '0');
        }

        function abrirModal(tipo) {
            tipoModal = tipo;
            const input = document.getElementById('modalInput');
            input.value = "";
            document.getElementById('radioRua').checked = true;

            if (tipo === 'avaria') {
                document.getElementById('modalTitle').innerText = "AVARIA EM:";
                document.getElementById('labelChute').style.display = "block";
            } else {
                document.getElementById('modalTitle').innerText = (tipo === 'rasgada') ? "RASGADA - RUA:" : "AMASSADA - RUA:";
                document.getElementById('labelChute').style.display = "none";
            }
            
            document.getElementById('modalInfo').style.display = "flex";
            input.focus();
        }

        function fecharModal() {
            document.getElementById('modalInfo').style.display = "none";
        }

        function confirmarModal() {
            const valor = document.getElementById('modalInput').value.trim();
            const tipoSelecao = document.querySelector('input[name="opcao"]:checked').value;

            if (valor === "") {
                alert("Por favor, informe a identificação.");
                return;
            }

            obsAtual.push({ tipo: tipoModal, subtipo: tipoSelecao, valor: valor });
            contagem[tipoModal]++;
            fecharModal();
            atualizarTela();
            salvarNoNavegador();
        }

        function alterar(tipo, valor) {
            if (contagem[tipo] + valor >= 0) {
                contagem[tipo] += valor;
                if (valor === -1) {
                    for (let i = obsAtual.length - 1; i >= 0; i--) {
                        if (obsAtual[i].tipo === tipo) {
                            obsAtual.splice(i, 1);
                            break;
                        }
                    }
                }
                atualizarTela();
                salvarNoNavegador();
            }
        }

        function renderizarHistorico() {
            const corpo = document.getElementById('corpo-relatorio');
            corpo.innerHTML = "";
            historico.forEach(item => {
                const linha = corpo.insertRow();
                linha.insertCell(0).innerText = item.id;
                linha.insertCell(1).innerText = item.conteudo;
            });
        }

        function limparTudo() {
            if (confirm("Isso apagará tudo sem salvar. Confirma?")) limparDadosSistema();
        }

        function limparDadosSistema() {
            localStorage.clear();
            contagem = { boa: 0, ruim: 0, rasgada: 0, amassada: 0, sem: 0, avaria: 0 };
            obsAtual = []; historico = []; proximaOnda = 1;
            atualizarTela(); renderizarHistorico();
        }
    </script>
</body>
</html>
