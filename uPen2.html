<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>µPen Editor v0.2.2</title>

    <style>
        :root {
            --bg-color: #1e1e1e;
            --toolbar-color: #2d2d2d;
            --text-color: #d4d4d4;
            --accent-color: #333333;
            --accent-hover: #454545;
            --border-color: #3c3c3c;
            --icon-fill: #cccccc;
            --danger-hover: #8e2e2e;
            --info-color: #777;
            --interactive-accent: #007acc;
        }

        .light-theme {
            --bg-color: #ffffff;
            --toolbar-color: #f0f0f0;
            --text-color: #000000;
            --accent-color: #dddddd;
            --accent-hover: #cccccc;
            --border-color: #bbbbbb;
            --icon-fill: #333333;
            --info-color: #555;
            --interactive-accent: #007acc;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            transition: background-color 0.3s;
        }

        .container { display: flex; flex-direction: column; height: 100vh; }

        header {
            background-color: var(--toolbar-color);
            padding: 8px 15px;
            display: flex; gap: 8px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        .btn-icon {
            background-color: var(--accent-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }

        .btn-icon:hover { background-color: var(--accent-hover); border-color: #555; }
        .btn-icon svg { width: 20px; height: 20px; fill: var(--icon-fill); }
        .btn-danger:hover { background-color: var(--danger-hover); border-color: #a00; }

        .info-panel { margin-left: auto; text-align: right; }
        .filename-display { font-size: 11px; font-family: 'Consolas', monospace; display: block; color: var(--text-color); }
        .cursor-pos { font-size: 10px; color: var(--info-color); font-family: 'Consolas', monospace; display: block; }

        textarea {
            flex-grow: 1; width: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: none; padding: 15px;
            box-sizing: border-box; resize: none;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 16px;
            line-height: 1.6;
            outline: none; overflow: auto;
            scrollbar-gutter: stable;
            caret-color: var(--interactive-accent);
        }
            
        .unsaved::after {
            content: ' *';
            color: #ffca28;
            font-weight: bold;
        }

        #modalHelp, #modalSettings {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center; justify-content: center;
        }

        .modal-content {
            background: var(--toolbar-color);
            color: var(--text-color);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .modal-content h2 { margin-top: 0; color: var(--interactive-accent); font-size: 1.5rem; }
        .modal-content h5 { margin: 0 0 15px 0; font-weight: normal; color: var(--info-color); }
        .modal-content ul { text-align: left; margin: 15px 0; padding-left: 20px; font-size: 14px; }
        .modal-content u2 { text-align: right; margin: 15px 0; font-size: 14px; font-style: italic; }
        .setting-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: bold; }

        input[type="checkbox"] {
            accent-color: var(--interactive-accent);
            cursor: pointer;
            vertical-align: middle;
            margin-right: 5px;
        }

        .close-modal {
            margin-top: 20px; width: 100%; 
            background: var(--interactive-accent); 
            color: white;
            border: none; padding: 12px; cursor: pointer; border-radius: 4px; font-weight: bold;
            transition: background-color 0.2s;
        }
        
        .close-modal:hover { background-color: #005a9e; }

        select, input[type="number"] {
            width: 100%; padding: 10px; background: var(--bg-color); color: var(--text-color);
            border: 1px solid var(--border-color); border-radius: 4px;
            box-sizing: border-box;
        }

        textarea::-webkit-scrollbar { width: 10px; height: 10px; }
        textarea::-webkit-scrollbar-track { background: var(--bg-color); }
        textarea::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 5px; }
    </style>
</head>

<body>

<div class="container">
    <header>
        <div id="btnNew" class="btn-icon btn-danger" title="Limpar tudo">
            <svg viewBox="0 0 24 24"><path d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19V4M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z"/></svg>
        </div>
        <div id="btnOpen" class="btn-icon" title="Abrir">
            <svg viewBox="0 0 24 24"><path d="M20,18H4V8H20M20,6H12L10,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V8C22,6.89 21.1,6 20,6Z"/></svg>
        </div>
        <div id="btnSave" class="btn-icon" title="Salvar">
            <svg viewBox="0 0 24 24"><path d="M15,9H5V5H15M12,19A3,3 0 0,1 9,16A3,3 0 0,1 12,13A3,3 0 0,1 15,16A3,3 0 0,1 12,19M17,3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V7L17,3Z"/></svg>
        </div>
        <div id="btnSettings" class="btn-icon" title="Configurações">
            <svg viewBox="0 0 24 24"><path d="M19.14,12.94A7.49,7.49 0 0,0 19.19,12A7.49,7.49 0 0,0 19.14,11.06L21.19,9.47C21.33,9.36 21.37,9.16 21.28,9L19.28,5.5C19.19,5.34 19,5.28 18.84,5.34L16.39,6.3C15.97,5.97 15.5,5.7 15,5.5L14.65,3C14.62,2.82 14.47,2.7 14.29,2.7H9.71C9.53,2.7 9.38,2.82 9.35,3L9,5.5C8.5,5.7 8.03,5.97 7.61,6.3L5.16,5.34C5,5.28 4.81,5.34 4.72,5.5L2.72,9C2.63,9.16 2.67,9.36 2.81,9.47L4.86,11.06C4.81,11.38 4.78,11.69 4.78,12C4.78,12.31 4.81,12.62 4.86,12.94L2.81,14.53C2.67,14.64 2.63,14.84 2.72,15L4.72,18.5C4.81,18.66 5,18.72 5.16,18.66L7.61,17.7C8.03,18.03 8.5,18.3 9,18.5L9.35,21C9.38,21.18 9.53,21.3 9.71,21.3H14.29C14.47,21.3 14.62,21.18 14.65,21L15,18.5C15.5,18.3 15.97,18.03 16.39,17.7L18.84,18.66C19,18.72 19.19,18.66 19.28,18.5L21.28,15C21.37,14.84 21.33,14.64 21.19,14.53L19.14,12.94M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5Z"/></svg>
        </div>
        <div id="btnHelp" class="btn-icon" title="Ajuda">
            <svg viewBox="0 0 24 24"><path d="M11,18H13V16H11V18M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,20C7.59,20 4,16.41 4,12C4,7.59 7.59,4 12,4C16.41,4 20,7.59 20,12C20,16.41 16.41,20 12,20M12,6A4,4 0 0,0 8,10H10A2,2 0 0,1 12,8A2,2 0 0,1 14,10C14,12 11,11.75 11,15H13C13,12.75 16,12.5 16,10A4,4 0 0,0 12,6Z"/></svg>
        </div>

        <div class="info-panel">
            <span id="fileName" class="filename-display">sem-titulo.txt</span>
            <span id="cursorPos" class="cursor-pos">Lin 1, Col 1</span>
        </div>
    </header>

    <textarea id="editor" wrap="off" spellcheck="false" placeholder="Comece a digitar..."></textarea>
    <input type="file" id="fileInput" accept=".txt,.xml" style="display:none;">
</div>

<div id="modalHelp">
    <div class="modal-content">
        <h5>Versão 0.2.2</h5>
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
        <ul>
            <li><strong>Minimalista:</strong> Editor simples e leve.</li>
            <li><strong>Smart XML:</strong> Auto-formatação para XML.</li>
            <li><strong>Tabulação:</strong> Agora configurável no menu.</li>
        </ul>
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
        <u2><br>By Jurimar M. C. Joazeiro</u2>
        <button class="close-modal" onclick="document.getElementById('modalHelp').style.display='none'">Fechar Ajuda</button>
    </div>
</div>

<div id="modalSettings">
    <div class="modal-content">
        <h2>Configurações</h2>
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
        
        <div class="setting-group">
            <label>
                <input type="checkbox" id="minifyCheck"> Ativar Smart XML.
                <small style="font-size: 10px; color: var(--info-color); display: block; margin-top: 4px;">Útil para NF-e.</small>
            </label>
        </div>

        <div class="setting-group">
            <label for="themeSelector">Tema:</label>
            <select id="themeSelector">
                <option value="dark">Escuro</option>
                <option value="light">Claro</option>
            </select>
        </div>

        <div class="setting-group">
            <label for="tabTypeSelector">Tipo de TAB:</label>
            <select id="tabTypeSelector">
                <option value="spaces">Espaços</option>
                <option value="tabChar">Caractere Tab (\t)</option>
            </select>
        </div>

        <div id="spaceCountGroup" class="setting-group">
            <label for="tabSizeInput">Espaços por TAB:</label>
            <input type="number" id="tabSizeInput" min="1" max="8" value="4">
        </div>

        <button class="close-modal" id="btnSaveSettings">Salvar e Fechar</button>
    </div>
</div>

<script>
    const editor = document.getElementById('editor');
    const fileNameDisplay = document.getElementById('fileName');
    const cursorPosDisplay = document.getElementById('cursorPos');
    const fileInput = document.getElementById('fileInput');
    const minifyCheck = document.getElementById('minifyCheck');
    const themeSelector = document.getElementById('themeSelector');
    const tabTypeSelector = document.getElementById('tabTypeSelector');
    const tabSizeInput = document.getElementById('tabSizeInput');
    const spaceCountGroup = document.getElementById('spaceCountGroup');
    
    const STORAGE_KEY_CONTENT = 'upen_draft_content';
    const STORAGE_KEY_NAME = 'upen_draft_name';
    const STORAGE_KEY_MINIFY = 'upen_minify_xml';
    const STORAGE_KEY_TAB_TYPE = 'upen_tab_type';
    const STORAGE_KEY_TAB_SIZE = 'upen_tab_size';

    // Toggle visibilidade do tamanho do tab
    tabTypeSelector.onchange = () => {
        spaceCountGroup.style.display = tabTypeSelector.value === 'spaces' ? 'block' : 'none';
    };

    function getTabText() {
        if (tabTypeSelector.value === 'tabChar') return "\t";
        const size = parseInt(tabSizeInput.value) || 4;
        return " ".repeat(size);
    }

    function formatXML(xml) {
        let formatted = '';
        let indent = '';
        const tab = getTabText();
        xml = xml.trim().replace(/>\s+</g, '><'); 
        const nodes = xml.split(/>\s*</);
        nodes.forEach((node) => {
            if (node.match(/^\/\w/)) indent = indent.substring(tab.length);
            let line = node;
            if (!line.startsWith('<')) line = '<' + line;
            if (!line.endsWith('>')) line = line + '>';
            formatted += indent + line + '\r\n';
            if (node.match(/^<?\w[^>]*[^\/]$/) && !node.startsWith("?") && !node.startsWith("/")) indent += tab;
        });
        return formatted.trim();
    }

    function minifyXML(xml) {
        return xml.replace(/>\s+</g, '><').trim();
    }

    // AÇÕES DE ARQUIVO
    document.getElementById('btnOpen').onclick = () => fileInput.click();

    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            let content = ev.target.result;
            const isXML = file.name.toLowerCase().endsWith('.xml');
            if(isXML && minifyCheck.checked) content = formatXML(content);
            updateEditor(content, file.name);
            fileInput.value = "";
        };
        reader.readAsText(file);
    };

    document.getElementById('btnSave').onclick = () => {
        let contentToSave = editor.value;
        const isXML = fileNameDisplay.textContent.toLowerCase().endsWith('.xml');
        if (isXML && minifyCheck.checked) contentToSave = minifyXML(contentToSave);
        const blob = new Blob([contentToSave], {type: isXML ? 'text/xml' : 'text/plain'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileNameDisplay.textContent;
        a.click();
        URL.revokeObjectURL(url);
        fileNameDisplay.classList.remove('unsaved');
    };

    // INTERFACE
    document.getElementById('btnNew').onclick = () => {
        if(confirm("Limpar tudo?")) updateEditor("", "sem-titulo.txt");
    };

    document.getElementById('btnSettings').onclick = () => document.getElementById('modalSettings').style.display = 'flex';
    
    document.getElementById('btnSaveSettings').onclick = () => {
        localStorage.setItem(STORAGE_KEY_MINIFY, minifyCheck.checked);
        localStorage.setItem('upen_theme', themeSelector.value);
        localStorage.setItem(STORAGE_KEY_TAB_TYPE, tabTypeSelector.value);
        localStorage.setItem(STORAGE_KEY_TAB_SIZE, tabSizeInput.value);
        applyTheme(themeSelector.value);
        document.getElementById('modalSettings').style.display = 'none';
    };

    function updateEditor(content, name){
        editor.value = content;
        fileNameDisplay.textContent = name;
        localStorage.setItem(STORAGE_KEY_CONTENT, content);
        localStorage.setItem(STORAGE_KEY_NAME, name);
        fileNameDisplay.classList.remove('unsaved');
        updateCursorInfo();
    }

    function updateCursorInfo(){
        const pos = editor.selectionStart;
        const lines = editor.value.substr(0, pos).split("\n");
        cursorPosDisplay.textContent = `Lin ${lines.length}, Col ${lines[lines.length-1].length + 1}`;
    }

    function applyTheme(theme) { document.documentElement.classList.toggle('light-theme', theme === 'light'); }

    window.onload = () => {
        // Carregar Tema
        const theme = localStorage.getItem('upen_theme') || 'dark';
        applyTheme(theme);
        themeSelector.value = theme;
        
        // Carregar Minificação
        minifyCheck.checked = localStorage.getItem(STORAGE_KEY_MINIFY) === 'true';
        
        // Carregar Configs de Tabulação
        tabTypeSelector.value = localStorage.getItem(STORAGE_KEY_TAB_TYPE) || 'spaces';
        tabSizeInput.value = localStorage.getItem(STORAGE_KEY_TAB_SIZE) || '4';
        tabTypeSelector.onchange(); // Atualiza UI

        // Carregar Conteúdo
        const c = localStorage.getItem(STORAGE_KEY_CONTENT);
        const n = localStorage.getItem(STORAGE_KEY_NAME);
        if (c) editor.value = c;
        if (n) fileNameDisplay.textContent = n;
        updateCursorInfo();
    };

    editor.oninput = () => {
        localStorage.setItem(STORAGE_KEY_CONTENT, editor.value);
        updateCursorInfo();
        fileNameDisplay.classList.add('unsaved');
    };

    ['keyup','click', 'focus'].forEach(ev => editor.addEventListener(ev, updateCursorInfo));

    editor.onkeydown = (e) => {
        if(e.ctrlKey && e.key === 's'){ 
            e.preventDefault(); 
            document.getElementById('btnSave').click();
        }
        
        if(e.key === 'Tab') {
            e.preventDefault();
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const tabText = getTabText();
    
            editor.value = editor.value.substring(0, start) + tabText + editor.value.substring(end);
            editor.selectionStart = editor.selectionEnd = start + tabText.length;
            
            // Disparar input para salvar rascunho
            editor.oninput();
        }
    };  

    document.getElementById('btnHelp').onclick = () => document.getElementById('modalHelp').style.display = 'flex';

    window.onclick = (event) => {
        if (event.target == document.getElementById('modalHelp')) document.getElementById('modalHelp').style.display = "none";
        if (event.target == document.getElementById('modalSettings')) document.getElementById('modalSettings').style.display = "none";
    }
</script>

</body>
</html>
